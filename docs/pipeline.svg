<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 400" role="img" aria-label="The omphjc pipeline: the process catalogue in config/ drives MadGraph, which writes an LHE file and its banner; DelphesPythia8 showers the events with Pythia 8 and writes only the generator record, particles.root; DelphesROOT runs the JetClass Delphes card on that record and writes delphes.root. A Parnassus simulation of the same record, with hadrons of c tau above 10 mm kept final, and the JetClass ntuple built from either simulation are planned and drawn with dashed borders.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; }
    .title { font-size: 15px; font-weight: 600; }
    .step { font-size: 12px; fill: #57606a; }
    .file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #0550ae; }
    .label { font-size: 11.5px; fill: #57606a; }
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.4; }
    .box.planned { stroke-dasharray: 5 4; }
    .arrow { stroke: #57606a; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .lane { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: #57606a; }
  </style>

  <text class="lane" x="20" y="28">CONFIGURATION</text>
  <text class="lane" x="290" y="28">GENERATE AND SHOWER</text>
  <text class="lane" x="840" y="28">SIMULATE</text>
  <text class="lane" x="1080" y="28">NTUPLE</text>

  <!-- 1. catalogue -->
  <rect class="box" x="20" y="48" width="220" height="150" rx="6"/>
  <text class="title" x="34" y="72">Process catalogue</text>
  <text class="step" x="34" y="92">one entry per process</text>
  <text class="file" x="34" y="116">config/jetclass.yaml</text>
  <text class="file" x="34" y="134">config/models/</text>
  <text class="file" x="34" y="152">config/madspin/</text>
  <text class="step" x="34" y="182">omphjc processes · check-cards</text>

  <!-- 2. madgraph -->
  <rect class="box" x="290" y="48" width="215" height="150" rx="6"/>
  <text class="title" x="304" y="72">MadGraph5_aMC@NLO</text>
  <text class="step" x="304" y="92">hard process, MadSpin decays</text>
  <text class="file" x="304" y="116">proc + launch scripts</text>
  <text class="file" x="304" y="134">→ events.lhe.gz</text>
  <text class="file" x="304" y="152">→ banner (σ, seed)</text>
  <text class="step" x="304" y="182">omphjc generate</text>

  <!-- 3. shower -->
  <rect class="box" x="555" y="48" width="235" height="150" rx="6"/>
  <text class="title" x="569" y="72">Pythia 8 shower</text>
  <text class="step" x="569" y="92">DelphesPythia8, record-only card</text>
  <text class="file" x="569" y="116">pythia.cmnd</text>
  <text class="file" x="569" y="134">particles_card.tcl</text>
  <text class="file" x="569" y="152">→ particles.root</text>
  <text class="step" x="569" y="182">omphjc shower · pythia show</text>

  <!-- 4. delphes -->
  <rect class="box" x="840" y="48" width="200" height="150" rx="6"/>
  <text class="title" x="854" y="72">Delphes simulation</text>
  <text class="step" x="854" y="92">DelphesROOT, detector card</text>
  <text class="file" x="854" y="116">config/delphes/*.tcl</text>
  <text class="file" x="854" y="134">→ delphes.root</text>
  <text class="step" x="854" y="182">omphjc simulate</text>

  <!-- 5. parnassus -->
  <rect class="box planned" x="840" y="236" width="200" height="104" rx="6"/>
  <text class="title" x="854" y="260">Parnassus simulation</text>
  <text class="step" x="854" y="280">cτ &gt; 10 mm kept final</text>
  <text class="file" x="854" y="304">→ parnassus.root</text>

  <!-- 6. ntuple -->
  <rect class="box planned" x="1080" y="48" width="150" height="150" rx="6"/>
  <text class="title" x="1094" y="72">JetClass ntuple</text>
  <text class="step" x="1094" y="92">jets, labels,</text>
  <text class="step" x="1094" y="108">constituents</text>
  <text class="file" x="1094" y="134">→ jetclass.parquet</text>

  <!-- arrows -->
  <line class="arrow" x1="240" y1="123" x2="290" y2="123"/>
  <text class="label" x="265" y="115" text-anchor="middle">cards</text>
  <line class="arrow" x1="505" y1="123" x2="555" y2="123"/>
  <text class="label" x="530" y="115" text-anchor="middle">LHE</text>
  <line class="arrow" x1="790" y1="123" x2="840" y2="123"/>
  <text class="label" x="815" y="115" text-anchor="middle">ROOT</text>
  <path class="arrow" d="M790,170 L815,170 L815,288 L840,288"/>
  <text class="label" x="808" y="240" text-anchor="end">ROOT</text>
  <line class="arrow" x1="1040" y1="123" x2="1080" y2="123"/>
  <path class="arrow" d="M1040,288 L1060,288 L1060,170 L1080,170"/>

  <!-- legend -->
  <rect class="box" x="20" y="244" width="18" height="12" rx="2"/>
  <text class="label" x="46" y="254">solid: available now</text>
  <rect class="box planned" x="20" y="266" width="18" height="12" rx="2"/>
  <text class="label" x="46" y="276">dashed: planned stage</text>

  <!-- job directory -->
  <text class="step" x="20" y="362">Each job writes one directory:</text>
  <text class="file" x="20" y="382">manifest.json · generate/ · shower/particles.root · simulate/delphes.root</text>
</svg>
