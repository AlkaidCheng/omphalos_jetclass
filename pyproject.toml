[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "omphjc"
dynamic = ["version"]
description = "JetClass sample generation for Delphes and Parnassus: MadGraph, Pythia8 and Delphes drivers with a simulation-level intermediate format."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alkaid Cheng", email = "alkaid.ccheng@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "black>=24",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.urls]
Repository = "https://github.com/AlkaidCheng/omphalos_jetclass"

[project.scripts]
omphjc = "omphjc.cli.main:cli"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["omphjc*"]
# omphjc/config links to the top-level config/ directory; it is data, and its
# vendored UFO models are not importable packages.
exclude = ["omphjc.config*"]

[tool.setuptools.package-data]
omphjc = ["py.typed", "config/**/*"]

[tool.setuptools_scm]
# Version derived from git tags; falls back to 0.0.0 in a shallow checkout.

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "^/config/|^/src/omphjc/config/"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["config", "src/omphjc/config"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C90"]
# Black owns line length.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["omphjc"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["omphjc"]
exclude = ["^config/", "src/omphjc/config/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs MadGraph, Pythia8 or Delphes installed",
]
